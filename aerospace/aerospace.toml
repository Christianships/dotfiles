# Hyprland-style AeroSpace config using Control as SUPER.

config-version = 2

after-startup-command = [
    'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change'
]
start-at-login = true

# Both normalizations are off on purpose: they are what collapse the window
# tree back into flat rows/columns, and `split` (the primitive dwindle.sh uses
# to build the Hyprland-style quadrant spiral) is a documented no-op while
# flatten-containers is enabled.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 20
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = [
    'move-mouse monitor-lazy-center',
    # Retarget OBS screen capture the instant focus moves to another
    # monitor, rather than waiting for the bridge's 5s poll.
    'exec-and-forget /opt/homebrew/bin/node /Users/christianaguilar/.config/sketchybar/plugins/obs-display.mjs --apply'
]

# SketchyBar integration. exec-on-workspace-change gets the new workspace
# in $AEROSPACE_FOCUSED_WORKSPACE; on-focus-changed keeps the per-workspace
# app icons fresh as windows open, close, and move.
on-focus-changed = [
    'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change',
    # Hyprland-style dwindle: pre-set the focused window's split orientation to
    # its short axis so the next window halves it instead of adding a column.
    'exec-and-forget /Users/christianaguilar/.config/aerospace/dwindle.sh'
]
exec-on-workspace-change = [
    '/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]
automatically-unhide-macos-hidden-apps = true

# Backstop for apps that open a window without taking focus, which would
# otherwise skip the on-focus-changed pass. dwindle.sh self-locks, so the two
# triggers firing together for one window is harmless.
# msig's panel is a small HUD centred on screen; keep it out of the tiling tree.
# Listed first so the dwindle callback below never sees it.
[[on-window-detected]]
    if.app-id = 'dev.christianaguilar.msig'
    run = ['layout floating']

[[on-window-detected]]
    check-further-callbacks = true
    run = ['exec-and-forget /Users/christianaguilar/.config/aerospace/dwindle.sh']

# Home workspaces. Apps land in the same place however they were launched --
# from a keybind, from Spotlight, or by another app.
#
# Ghostty and the browser are deliberately absent: terminals and browser windows
# open on whatever workspace is focused rather than being pulled to a fixed one.
[[on-window-detected]]
    if.app-id = 'com.t3tools.t3code'
    run = ['move-node-to-workspace 1']

[[on-window-detected]]
    if.app-id = 'com.obsproject.obs-studio'
    run = ['move-node-to-workspace 4']

[gaps]
    inner.horizontal = 8
    inner.vertical = 8
    outer.left = 8
    outer.bottom = 8
    # Room for SketchyBar, which occupies y=3..35.
    #
    # Per-monitor, because the two screens differ: the built-in is notched,
    # so macOS already withholds the top 32pt from visibleFrame and the bar
    # lives in that otherwise-dead row -- only a normal gap is needed. An
    # external panel has no notch, so macOS reserves nothing and AeroSpace
    # would tile straight over the bar; 43 = bar bottom (35) + an 8pt gap.
    outer.top = [{ monitor.'built-in' = 8 }, 43]
    outer.right = 8

[exec]
    inherit-env-vars = true

[exec.env-vars]
    PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[mode.main.binding]
    # Apps
    ctrl-enter = 'exec-and-forget open -na Ghostty'
    ctrl-shift-t = 'exec-and-forget /Users/christianaguilar/.config/aerospace/launch-agent-grid.sh'
    # Search has no new-window command (tabs only), so -n starts another instance
    # of the app: each press is a separate Search window.
    ctrl-b = 'exec-and-forget open -na Search'
    # Disable accidental app quits via Command-Q; Control-Q remains the intentional quit shortcut.
    cmd-q = 'exec-and-forget true'
    ctrl-q = 'close --quit-if-last-window'
    ctrl-shift-f = 'exec-and-forget open -na Figma'

    # Blurred keybinding overlay, generated from this file at press time.
    ctrl-shift-slash = 'exec-and-forget /Users/christianaguilar/.config/aerospace/keys.sh'
    ctrl-shift-c = ['workspace 1', 'exec-and-forget open -na "T3 Code (Alpha)"']

    # OBS controls
    # Scenes and camera controls. Control is the SUPER key in this config.
    ctrl-alt-0 = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs scene start'
    ctrl-alt-1 = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs scene camera'
    ctrl-alt-2 = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs scene screen'
    ctrl-alt-3 = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs scene explain'
    ctrl-alt-c = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs follow toggle'
    ctrl-alt-r = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs record toggle'
    ctrl-alt-shift-r = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs record stop'
    ctrl-alt-f = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs refresh force'
    ctrl-alt-m = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs marker MARK'
    ctrl-alt-shift-m = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs mute toggle'
    ctrl-alt-n = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs camera next'
    ctrl-alt-shift-n = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs camera prev'
    ctrl-alt-s = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs stream toggle'
    ctrl-alt-p = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs iphone'
    # Panic button: pixelate every screen capture on stream, banner it, and
    # turn the whole bar blood red until it is switched back off.
    ctrl-alt-b = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs blur toggle'
    # Fullscreen view of exactly what OBS is putting out, and back again.
    ctrl-alt-t = 'exec-and-forget /usr/bin/env node /Users/christianaguilar/Documents/Director/scripts/obs-control.mjs projector toggle'

    # Layouts
    ctrl-slash = 'layout tiles horizontal vertical'
    ctrl-comma = 'layout accordion horizontal vertical'
    ctrl-f = 'fullscreen'
    # Super+Shift+= ("make equal"). Plain Super+E is left to the terminal and
    # macOS text fields, where it means end-of-line.
    ctrl-shift-equal = 'balance-sizes'
    # Rebuild the current workspace as a dwindle spiral, and toggle the
    # auto-splitting on or off.
    ctrl-shift-e = 'exec-and-forget /Users/christianaguilar/.config/aerospace/dwindle-retile.sh'
    ctrl-shift-d = 'exec-and-forget /Users/christianaguilar/.config/aerospace/dwindle-toggle.sh'

    # Focus, Hyprland/i3 style
    ctrl-h = 'focus left'
    ctrl-j = 'focus down'
    ctrl-k = 'focus up'
    ctrl-l = 'focus right'
    ctrl-left = 'focus left'
    ctrl-down = 'focus down'
    ctrl-up = 'focus up'
    ctrl-right = 'focus right'
    cmd-tab = 'focus-back-and-forth'
    cmd-shift-tab = 'focus-back-and-forth'

    # Move windows
    ctrl-shift-h = 'move left'
    ctrl-shift-j = 'move down'
    ctrl-shift-k = 'move up'
    ctrl-shift-l = 'move right'
    ctrl-shift-left = 'move left'
    ctrl-shift-down = 'move down'
    ctrl-shift-up = 'move up'
    ctrl-shift-right = 'move right'

    # Workspaces
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'
    ctrl-0 = 'workspace 10'
    ctrl-tab = 'workspace-back-and-forth'
    ctrl-period = 'workspace next'
    ctrl-semicolon = 'workspace prev'

    # Send windows to workspaces
    ctrl-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    ctrl-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    ctrl-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    ctrl-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    ctrl-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    ctrl-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    ctrl-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    ctrl-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    ctrl-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
    ctrl-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

    # Monitors
    ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    ctrl-alt-tab = 'focus-monitor --wrap-around next'
    ctrl-alt-shift-tab = 'move-node-to-monitor --wrap-around next'

    # Resize mode and service mode
    # Super+Shift+R. Plain Super+R is left to the terminal for history search.
    ctrl-shift-r = ['mode resize', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=resize']
    ctrl-shift-semicolon = ['mode service', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=service']

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    left = 'resize width -50'
    down = 'resize height +50'
    up = 'resize height -50'
    right = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = ['mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
    esc = ['mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']

[mode.service.binding]
    esc = ['reload-config', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
    r = ['reload-config', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
    f = ['flatten-workspace-tree', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
    b = ['balance-sizes', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
    backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_mode_change MODE=main']
