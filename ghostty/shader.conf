# Active Ghostty shaders. Managed by `gshader`. Included from `config`
# via config-file. Ghostty runs these IN ORDER, each one receiving the
# previous shader's output as iChannel0 -- so put a full-screen background
# first and cursor effects after it. No lines = no shader.
custom-shader = shaders/last_letter_zoom.glsl
custom-shader = shaders/cursor_frozen.glsl
custom-shader = shaders/sparks.glsl
